name: Build userscript

on:
  push:
    branches: [main]
    paths:
      - "src/parts/**"
      - ".github/workflows/build-userscript.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild userscript
        run: cat src/parts/*.part > lovable-project-downloader.user.js

      - name: Commit generated file
        run: |
          if git diff --quiet -- lovable-project-downloader.user.js; then
            echo "Userscript already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lovable-project-downloader.user.js
          git commit -m "build: generate installable userscript"
          git push
